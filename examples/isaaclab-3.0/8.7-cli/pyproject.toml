# 第二种挂法：把本目录装进 3.0 环境（uv pip install -e .）后，isaaclab 在运行 train / play 等子命令前
# 会导入 `isaaclab.tasks` 入口点组里登记的模块（isaaclab/cli/__init__.py 的 _load_external_tasks）。
# 本站没有把它装进 3.0 环境，这种挂法未验证。
[project]
name = "academy-cli-demo"
version = "0.1.0"
requires-python = ">=3.12"

[project.entry-points."isaaclab.tasks"]
academy_cli_demo = "academy_cli_demo.tasks"

[tool.setuptools]
packages = ["academy_cli_demo"]
