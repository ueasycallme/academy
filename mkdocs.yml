site_name: Isaac Academy
site_url: https://academy.kiloong.com
site_description: Isaac Sim / Isaac Lab 中文导读：体系框架、核心概念与工程落地
docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  # 不加载 Google Fonts，改用系统字体栈（见 stylesheets/extra.css）
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

extra_css:
  - stylesheets/extra.css

# 自托管 Mermaid：Material 检测到全局 mermaid 已存在时不再从 unpkg 加载
# 版本 11.17.2（npm registry tarball），与 Material 9.7.7 默认的 mermaid@11 同一大版本
extra_javascript:
  - assets/js/mermaid.min.js

plugins:
  # 中文分词：Material 内置 search 插件在安装 jieba 时自动用 jieba 分词
  - search:
      lang:
        - zh
        - en
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

not_in_nav: |
  /0-map/_template-check.md
  /0-map/0.4-isaac-names.md
  /1-env/1.1-compat-matrix.md
  /8-frontier/8.1-what-changed.md
  /3-isaacsim/3.3-rigid-collision.md
  /3-isaacsim/3.4-articulation.md
  /5-rl/5.8-training-debug.md
  /appendix/A.2-error-index.md
  /3-isaacsim/3.1-sim-loop.md
  /4-isaaclab/4.9-manager-based-env.md
  /4-isaaclab/4.14-direct-env.md
  /5-rl/5.4-parallel-envs.md
  /9-source/9.1-rl-env-step.md
  /3-isaacsim/3.11-api-map.md
  /4-isaaclab/4.2-repo-map.md

nav:
  - 首页: index.md
  - 全景地图:
      - 0-map/index.md
      - 0.2 分层依赖图: 0-map/0.2-layers.md
      - 0.3 产品谱系与改名史: 0-map/0.3-lineage.md
      - 0.5 Isaac Sim 与 Isaac Lab 的边界: 0-map/0.5-sim-lab-boundary.md
      - 0.6 一个 RL step 里发生了什么: 0-map/0.6-one-step.md
